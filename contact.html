<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Lamine Kane</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="content">
    <a class="back-link" href="index.html">← Home</a>

    <section class="contact-section">
      <h1>Contact</h1>
      <p>If you'd like to reach out, email me at <a href="mailto:lamine.kane@example.com">lamine.kane@lions.lincoln.edu</a> (replace with your email).</p>

      <h3>Quick Message</h3>
      <form id="contact-form" class="contact-form" onsubmit="handleContact(event)">
        <label>
          Your name
          <input type="text" name="name" required>
        </label>
        <label>
          Your email
          <input type="email" name="email" required>
        </label>
        <label>
          Message
          <textarea name="message" rows="4" required></textarea>
        </label>
        <button type="submit" class="primary-btn">Send (opens mail)</button>
      </form>
      <p class="hint">The form opens your mail client to send a message (simple approach for GitHub Pages).</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
